name: CICD using Maven and tomcat
on:
  push:
  workflow_dispatch:

jobs:
  CICDjob:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build the code
        run: mvn -q -e package
      - name: Trigger Jenkins locally (with crumb)
        run: |
          J_USER='jenkins_user'          # use a Jenkins API token, not a password
          J_TOKEN='xxxxxx'
          BASE='http://localhost:8080'

          CRUMB=$(curl -s -u "$J_USER:$J_TOKEN" "$BASE/crumbIssuer/api/json" \
                  | python3 - <<'PY'
import sys, json
d=json.load(sys.stdin)
print(f"{d['crumbRequestField']}:{d['crumb']}")
PY
          )

          curl -sS -u "$J_USER:$J_TOKEN" -H "$CRUMB" -X POST \
            "$BASE/job/jenkins-tomcat-deployment-pipeline/buildWithParameters?token=token1&param1=value"
