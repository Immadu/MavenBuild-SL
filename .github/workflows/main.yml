name: CICD using Maven and tomcat
on:
 push:  # run when there is commit to repo
 workflow_dispatch:  # run manually
jobs:
 CICDjob:
   runs-on: ubuntu-latest
   steps:
    - name: Clone the repo on ubuntu server
      uses: actions/checkout@v4
    - name: Install Java and maven on ubuntu server
      uses: actions/setup-java@v4
      with:
       distribution: 'temurin'
       java-version: '11'
       cache: 'maven'
    - name: Build the code 
      run: mvn package
    - name: Connect to Lab machine and trigger a Jenkins job 
      uses: cross-the-world/ssh-scp-ssh-pipelines@latest
      with:
        host: '69.112.180.123'
        user: 'sadio'
        pass: 'Sajor@8903'
        port: 22
        connect_timeout: 10s
        first_ssh: |
           curl -l -u sadio:Sajor@8903 http://localhost:8080/job/jenkins-tomcat-deployment-pipeline/build?token=token1
